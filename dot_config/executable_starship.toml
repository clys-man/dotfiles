# Sets user-defined palette
palette = "catppuccin_mocha"

# Setups
format = "$python$conda$directory$git_branch$character"
right_format = """$git_status$cmd_duration"""
add_newline = false

[conda]
format = ' [$symbol$environment](dimmed green) '
symbol = " "

# Prompt symbols 
[character]
success_symbol = "[](green bold)"
error_symbol = "[](red)"

[directory]
format = "[]($style)[λ ](bg:mantle fg:text)[$path](bg:mantle fg:lavender bold)[ ]($style)"
style = "bg:none fg:mantle"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[]($style)[[ ](bg:mantle fg:green bold)$branch](bg:mantle fg:lavender)[ ]($style)"
style = "bg:none fg:mantle"
symbol = " "

[git_status]
# $all status$ahead_behind
format = "[]($style)[$all_status$ahead_behind](bg:mantle fg:yellow)[ ]($style)"
style = "bg:none fg:mantle"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = ""
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "${count}"

[cmd_duration]
min_time = 1
# duration & style 
format = "[]($style)[[神](bg:mantle fg:flamingo bold)$duration](bg:mantle fg:text)[ ]($style)"
disabled = false
style = "bg:none fg:mantle"

