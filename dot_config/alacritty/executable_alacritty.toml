[env]
TERM = "xterm-256color"

[font]
size = 12

[font.glyph_offset]
x = 0
y = 0

[font.bold]
family = "MesloLGS NF"
style = "Bold"

[font.italic]
family = "MesloLGS NF"
style = "Italic"

[font.normal]
family = "MesloLGS NF"
style = "Regular"

[window]
decorations = "Full"

[window.padding]
x = 8
y = 8

[general]
import = ["~/.config/alacritty/catppuccin-mocha.toml"]
