#     bezier = linear, 1, 1, 0, 0
#     animation = fadeIn, 1, 5, linear
#     animation = fadeOut, 1, 5, linear
#     animation = inputFieldDots, 1, 2, linear
# }

background {
    monitor =
    path = $HOME/.wallpapers/montain.jpg
    blur_passes = 3
    color = $base
}

# USER AVATAR
image {
  monitor =
  border_size = 2
  path = $HOME/.profile.png
  size = 100
  border_color = $accent
  position = 0, 75
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 2
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +"%A, %d de %B de %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# LAYOUT
label {
    monitor =
    text = $LAYOUT[br,us]
    color = $text
    font_size = 25
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 200, -50
    halign = center
    valign = center
}
