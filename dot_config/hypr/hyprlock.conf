source = $HOME/.config/hypr/themes/catppuccin-mocha.conf

$accent = $blue
$accentAlpha = $blueAlpha
$font = FiraCode Nerd Font

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
