source = $HOME/.config/hypr/themes/catppuccin-mocha.conf

$accent = $blue
$font = FiraCode Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.wallpapers/montain.jpg
    color = $base
    blur_passes = 2
    blur_size = 5
    brightness = 0.55
    contrast = 0.95
    noise = 0.01
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 82
    font_family = $font
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %-d"
    color = $subtext1
    font_size = 18
    font_family = $font
    position = 0, 115
    halign = center
    valign = center
}

image {
    monitor =
    path = $HOME/.config/hypr/lock-avatar.png
    reload_time = 5
    reload_cmd = python3 -B "$HOME/.config/hypr/lock-status.py" avatar
    size = 64
    rounding = -1
    border_size = 0
    position = 0, 5
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] python3 -B "$HOME/.config/hypr/lock-status.py" user
    color = $text
    font_size = 18
    font_family = $font
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    rounding = 14
    outline_thickness = 2
    outer_color = $surface1
    inner_color = rgba(313244dd)
    font_color = $text
    font_family = $font
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = Password
    hide_input = false
    check_color = $accent
    check_text = Unlocking…
    fail_color = $red
    fail_text = Authentication failed ($ATTEMPTS)
    capslock_color = $yellow
    bothlock_color = $yellow
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[BR,US]
    color = $subtext0
    font_size = 12
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -168
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] python3 -B "$HOME/.config/hypr/lock-status.py" caps
    color = $yellow
    font_size = 12
    font_family = $font
    position = 0, -195
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] python3 -B "$HOME/.config/hypr/lock-status.py" battery
    color = $subtext1
    font_size = 13
    font_family = $font
    position = 0, 36
    halign = center
    valign = bottom
}
