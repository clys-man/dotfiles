# Terminal.
set -ga terminal-overrides ",xterm-256color:Tc"

# Undercurl
set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Settings.
set -g prefix None
set -g prefix2 None
setw -g mode-keys vi
set -g base-index 1
setw -g mouse on
set -s escape-time 0
set -g focus-events on
set -g automatic-rename on
set-option -g set-titles on
set-option -gw xterm-keys on
set -g status-interval 1
set -g renumber-windows on

# Some setup.
unbind h
unbind j
unbind k
unbind l
unbind M-h
unbind M-j
unbind M-k
unbind M-l

# Modes
bind -T copy-mode-vi Escape send-keys -X cancel

# Panes.
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R
bind -n M-q kill-pane
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-= next-layout

# Windows.
bind -n M-Tab next-window
bind -n M-S-Tab previous-window
bind -n M-l next-window
bind -n M-h previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :0
bind -n M-w command-prompt -I "#W" "rename-window '%%'"

# Session.
bind -n M-r command-prompt -I "#S" "rename-session '%%'"

# Plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'

onedark_black="#1e1e2e"
dark_black="#181825"
white="#cdd6f4"

set -g pane-border-style "fg=#45475a bg=#1e1e2e" # i.e. "$onedark_black"
set -g pane-active-border-style "fg=#89b4fa bg=#1e1e2e" # i.e. "$onedark_black"

# Info on left (I don't have a session display for now)
set -g status-left ''

set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left '#[fg=#89b4fa,bold]#S '
set -g status-right '  #[fg=#cdd6f4] %Y-%m-%d #[fg=white,bold]%H:%M:%S'

set -g status-right-length 50
set -g status-left-length 20

# Set the style for windows.
# TODO: note that the 'red' in the status is not being shown, this is because we 
# need a multi-conditional at the moment these are sequential so the most recent
# overwrite the others.
# setw -g window-status-format '#I#[fg=#a6adc8]:#[fg=#cdd6f4]#{?window_activity_flag, #[fg=green],}#{?window_bell_flag,#[fg=red]#[blink],}#W#[fg=#89b4fa]#F '
# This is the same status as above, with no highlight for activity.
setw -g window-status-format '#I#[fg=#a6adc8,bg=#181825]:#W#[fg=#89b4fa,bg=#181825]#F '

# Set the style for the _current_ window.
setw -g window-status-current-format '#[fg=#cdd6f4,bg=#181825]#I#[fg=#a6adc8]:#[fg=#cdd6f4,bold]#W#[fg=#89b4fa]#F '
